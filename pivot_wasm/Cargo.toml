[package]
name = "pivot-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false                        # ← add this

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "console",
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "Window",
  "Document",
  "TextMetrics",
] }

[profile.release]
opt-level = "s"
lto = true